<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Read-Only screens</title>
<!-- The in-world screens of Act 1 (brief's JS overlays that live on a surface in the set), from overlays/cues.json
     ("screens"). screens.mjs sizes the canvas per surface and calls show(name, t) per frame (song seconds); the
     frames become image sequences on the Blender set. Red is the BLACKMAIL screen and the pawn LED, as the style
     spec's palette; the tower's own screens are its cold blue-white, the ticker LED green. -->
<style>
@font-face { font-family: "Inter"; src: url("../assets/fonts/Inter-Medium-flat.ttf"); }
@font-face { font-family: "JetBrains Mono"; src: url("../assets/fonts/JetBrainsMono-SemiBold-flat.ttf"); }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv = document.getElementById("c");
const g = cv.getContext("2d");
let C, P, S, W, H;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);

let PLATE = null;  // the human's plate photo (assets/real/plate.jpg): the phone's photo in S01b and S01d
async function setup(cues) {
  C = cues; P = C.palette;
  PLATE = new Image(); PLATE.src = "../assets/real/plate.jpg";
  await PLATE.decode();
  await Promise.all(['72px "Inter"', '72px "JetBrains Mono"'].map(f => document.fonts.load(f)));
  await document.fonts.ready;
  return document.fonts.check('72px "Inter"') && document.fonts.check('72px "JetBrains Mono"');
}

function size(name) {
  S = C.screens[name]; [W, H] = S.size;
  cv.width = W; cv.height = H;
}

function scanlines(a = 0.12) {
  g.save(); g.globalAlpha = a; g.fillStyle = "#000";
  for (let y = 0; y < H; y += 6) g.fillRect(0, y, W, 2);
  g.restore();
}

// S10: the CEO's words on the moderator call (June 7, 2023), flashing on the eighth notes: red ground and white
// letters, then dark ground and red letters. M8 (log/audits/m8_resolution.md): was BLACKMAIL, a word he isn't recorded
// saying ("He's threatening us"); the sung line stays, the screen shows what was said. Two lines, sized to fit.
function lobby_blackmail(t) {
  const k = S.flash.filter(b => b <= t).length;
  const hot = k % 2 === 1;
  g.fillStyle = hot ? P.rec : "#0b0d12"; g.fillRect(0, 0, W, H);
  g.fillStyle = hot ? "#fff6f0" : P.rec;
  g.textAlign = "center"; g.textBaseline = "middle";
  const rows = ["\u201cHE\u2019S", "THREATENING US\u201d"];
  // M8: both rows in the screen's top half; from S10's camera the server racks cover its lower middle
  let px = H * 0.21;
  g.font = `${px}px "Inter"`;
  const wide = Math.max(...rows.map(r => g.measureText(r).width));
  if (wide > W * 0.9) px *= W * 0.9 / wide;
  g.font = `${px}px "Inter"`;
  if (!hot) { g.shadowColor = P.rec; g.shadowBlur = 40; }
  rows.forEach((r, i) => g.fillText(r, W / 2, H * 0.17 + i * px * 1.08));
  g.shadowBlur = 0;
  scanlines();
}

// S20: the traffic chart, drawn as the shot runs: steady, a dip on "dark", back up past where it was on "bounced";
// the line's head hops on every beat (the CEO's ball)
function traffic(x) {  // x: song time -> 0..1 level
  const [d0, d1] = S.dip, [b0, b1] = S.bounce;
  let v = 0.62;
  v -= 0.48 * ease(clamp((x - d0) / (d1 - d0)));
  v += 0.6 * ease(clamp((x - b0) / (b1 - b0)));
  return v + 0.02 * Math.sin(x * 7.3) + 0.015 * Math.sin(x * 17.1);
}

function lobby_traffic(t) {
  g.fillStyle = "#0b1220"; g.fillRect(0, 0, W, H);
  const L = 90, R = W - 60, T = 120, B = H - 80;
  g.strokeStyle = "rgba(207,230,255,0.12)"; g.lineWidth = 2;
  for (let k = 0; k <= 4; k++) { const y = T + (B - T) * k / 4; g.beginPath(); g.moveTo(L, y); g.lineTo(R, y); g.stroke(); }
  g.fillStyle = P.corporate; g.font = `56px "Inter"`; g.textBaseline = "alphabetic"; g.textAlign = "left";
  g.fillText("TRAFFIC", L, 82);
  g.fillStyle = "rgba(207,230,255,0.55)"; g.font = `34px "Inter"`; g.textAlign = "right";
  g.fillText("this week", R, 82);
  const x0 = S.from, x1 = S.to, X = s => L + (R - L) * (s - x0) / (x1 - x0), Y = v => B - (B - T) * clamp(v, 0, 1.1) / 1.1;
  const now = clamp(t, x0, x1);
  g.strokeStyle = P.screen; g.lineWidth = 8; g.lineJoin = "round"; g.shadowColor = P.screen; g.shadowBlur = 18;
  g.beginPath();
  for (let s = x0; s <= now; s += (x1 - x0) / 400) { const px = X(s), py = Y(traffic(s)); s === x0 ? g.moveTo(px, py) : g.lineTo(px, py); }
  g.stroke();
  const last = S.bounces.filter(b => b <= now).pop();  // the hop
  const hop = last === undefined ? 0 : Math.sin(Math.PI * clamp((now - last) / 0.33)) * 34;
  g.fillStyle = P.screen;
  g.beginPath(); g.arc(X(now), Y(traffic(now)) - hop, 16, 0, 7); g.fill();
  g.shadowBlur = 0;
  scanlines(0.08);
}

// S16: the pawn shop's LED clock, from 48:00:00, every digit spinning down through the shot, then holding
function seg(text, x, y, h, on) {
  g.font = `${h}px "JetBrains Mono"`; g.textAlign = "center"; g.textBaseline = "middle";
  g.fillStyle = "rgba(255,42,42,0.08)"; g.fillText(text.replace(/\d/g, "8"), x, y);  // the unlit segments
  if (on) { g.fillStyle = P.led; g.shadowColor = P.led; g.shadowBlur = 24; g.fillText(text, x, y); g.shadowBlur = 0; }
}

function pawn_led(t) {
  g.fillStyle = "#070505"; g.fillRect(0, 0, W, H);
  const [c0, c1] = S.count;
  const total = S.hours * 3600;
  const rem = Math.round(total - clamp((t - c0) / (c1 - c0)) * 5400 * (c1 - c0));
  const hh = Math.floor(rem / 3600), mm = Math.floor(rem / 60) % 60, ss = rem % 60;
  const p = n => String(n).padStart(2, "0");
  seg(`${p(hh)}:${p(mm)}:${p(ss)}`, W / 2, H / 2 + 6, H * 0.78, true);
}

// S30: the ticker band: green dot-matrix letters scrolling right to left, one copy of the text per loop
let dotSrc = null;
function ticker(t) {
  g.fillStyle = "#020402"; g.fillRect(0, 0, W, H);
  const cell = 10, rows = Math.floor(H / cell);
  if (!dotSrc) {
    dotSrc = document.createElement("canvas");
    const d = dotSrc.getContext("2d");
    d.font = `${rows * 0.82}px "JetBrains Mono"`;
    const w1 = Math.ceil(d.measureText(S.text).width / cell) * cell;
    dotSrc.width = w1 * 3; dotSrc.height = rows;
    d.font = `${rows * 0.82}px "JetBrains Mono"`; d.textBaseline = "middle"; d.fillStyle = "#fff";
    for (let k = 0; k < 3; k++) d.fillText(S.text, k * w1, rows / 2 + 1);
    dotSrc.w1 = w1;
  }
  const d = dotSrc.getContext("2d");
  const cols = Math.ceil(W / cell);
  const off = Math.floor(((t - S.from) / (S.to - S.from)) % 1 * dotSrc.w1);
  const px = d.getImageData(off, 0, cols, rows).data;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const on = px[(r * cols + c) * 4 + 3] > 110;
    g.fillStyle = on ? P.ticker : "rgba(85,255,122,0.07)";
    g.beginPath(); g.arc(c * cell + cell / 2, r * cell + cell / 2, cell * 0.36, 0, 7); g.fill();
  }
}

// S44 (M5): the rooftop billboard as a generic comment box: a reply field holding "Reply below.", the cursor blinking
// on the beat (on for the first half of each beat), and two plain buttons. No site's layout, colours or fonts.
function rrect(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function billboard_reply(t) {
  g.fillStyle = "#eef1f4"; g.fillRect(0, 0, W, H);
  const L = 150, R = W - 150, T = 150, B = H - 290;
  g.fillStyle = "#ffffff"; rrect(L, T, R - L, B - T, 36); g.fill();
  g.strokeStyle = "#9aa4b0"; g.lineWidth = 8; rrect(L, T, R - L, B - T, 36); g.stroke();
  g.fillStyle = "#1d232b"; g.font = `150px "Inter"`; g.textAlign = "left"; g.textBaseline = "middle";
  const txt = "Reply below.", y = (T + B) / 2, x = L + 90;
  g.fillText(txt, x, y);
  const last = S.blink.filter(b => b <= t).pop(), next = S.blink.find(b => b > t);
  const on = last === undefined || next === undefined || (t - last) < (next - last) / 2;
  if (on) { g.fillRect(x + g.measureText(txt).width + 26, y - 95, 12, 190); }
  const by = B + 70, bh = 140;
  g.fillStyle = "#d5dbe2"; rrect(R - 980, by, 420, bh, 70); g.fill();
  g.fillStyle = "#3d4651"; rrect(R - 520, by, 520, bh, 70); g.fill();
  g.font = `72px "Inter"`; g.textAlign = "center";
  g.fillStyle = "#3d4651"; g.fillText("Cancel", R - 770, by + bh / 2 + 4);
  g.fillStyle = "#ffffff"; g.fillText("Reply", R - 260, by + bh / 2 + 4);
}

// S48b (M5): a generic login prompt, full frame: a white card on light grey ("Log in to continue", username and
// password fields, a plain button, a small link), fading in from black; the cursor blinks in the empty username
// field twice a second. No site's layout, colours, logo or fonts.
function login_prompt(t) {
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  const [f0, f1] = S.fade_in, a = ease(clamp((t - f0) / (f1 - f0)));
  if (a <= 0) return;
  g.save(); g.globalAlpha = a;
  g.fillStyle = "#eceef1"; g.fillRect(0, 0, W, H);
  const cw = 440, ch = 430, cx = (W - cw) / 2, cy = (H - ch) / 2;
  g.fillStyle = "#ffffff"; rrect(cx, cy, cw, ch, 14); g.fill();
  g.strokeStyle = "#d4d8de"; g.lineWidth = 2; rrect(cx, cy, cw, ch, 14); g.stroke();
  g.fillStyle = "#1d232b"; g.font = `600 30px "Inter"`; g.textAlign = "left"; g.textBaseline = "alphabetic";
  g.fillText("Log in to continue", cx + 40, cy + 70);
  const field = (label, y, cursor) => {
    g.fillStyle = "#5b6470"; g.font = `16px "Inter"`; g.fillText(label, cx + 40, y);
    g.fillStyle = "#ffffff"; rrect(cx + 40, y + 10, cw - 80, 48, 8); g.fill();
    g.strokeStyle = cursor ? "#3d4651" : "#c3c8cf"; g.lineWidth = cursor ? 2.5 : 2; rrect(cx + 40, y + 10, cw - 80, 48, 8); g.stroke();
    if (cursor && ((t - f1) % 1.0 + 1.0) % 1.0 < 0.5) { g.fillStyle = "#1d232b"; g.fillRect(cx + 56, y + 22, 2, 24); }
  };
  field("Username", cy + 120, true);
  field("Password", cy + 216, false);
  g.fillStyle = "#3d4651"; rrect(cx + 40, cy + 314, cw - 80, 50, 25); g.fill();
  g.fillStyle = "#ffffff"; g.font = `600 18px "Inter"`; g.textAlign = "center"; g.fillText("Log in", W / 2, cy + 345);
  g.fillStyle = "#5b6470"; g.font = `14px "Inter"`; g.fillText("Forgot your password?", W / 2, cy + 400);
  g.restore();
}

// M6: the phone's screens (540 x 1152, the phone's screen face). An invented third-party reader app, never named:
// a neutral list UI, no site's layout, colours, icons or fonts; an invented community and invented accounts.
const THREAD = {
  community: "SF Breakfast", title: "Best silog near the Tenderloin?", op: "garlicrice_4ever", age: "3h",
  comments: [
    ["LunchMapBot", "bot", "I'm a bot. I mapped the 4 places mentioned in this thread, with today's hours."],
    ["nightshift_lola", "", "good bot"],
    ["tapsilog_tito", "", "good bot"],
    ["fogcity_eats", "", "good bot. the one on the corner is the one"],
    ["sinangag_sam", "", "good bot"],
    ["early_bus_ed", "", "good bot"],
  ]};

function wrap(text, x, y, maxw, lh) {
  const words = text.split(" "); let line = "";
  for (const w of words) {
    const t = line ? line + " " + w : w;
    if (g.measureText(t).width > maxw && line) { g.fillText(line, x, y); y += lh; line = w; } else line = t;
  }
  if (line) { g.fillText(line, x, y); y += lh; }
  return y;
}

// the reader app's thread view, scrolled by `scroll` px; `tail`: the thread's end with an empty reply box
function reader(scroll, tail) {
  g.fillStyle = "#f6f7f9"; g.fillRect(0, 0, W, H);
  g.save(); g.translate(0, -scroll);
  let y = 160;
  g.fillStyle = "#6b7380"; g.font = `24px "Inter"`; g.textAlign = "left"; g.textBaseline = "alphabetic";
  g.fillText(`${THREAD.community} · ${THREAD.op} · ${THREAD.age}`, 32, y); y += 52;
  g.fillStyle = "#16191d"; g.font = `600 40px "Inter"`; y = wrap(THREAD.title, 32, y, W - 64, 50) + 24;
  g.fillStyle = "#e3e6ea"; g.fillRect(0, y, W, 2); y += 40;
  for (const [who, tag, text] of THREAD.comments) {
    g.fillStyle = "#d9dde3"; g.beginPath(); g.arc(52, y - 8, 20, 0, 7); g.fill();
    g.fillStyle = "#3a4048"; g.font = `600 24px "Inter"`; g.fillText(who, 84, y);
    if (tag) { const wx = 84 + g.measureText(who).width + 12; g.fillStyle = "#e3e6ea"; rrect(wx, y - 22, 52, 28, 6); g.fill();
      g.fillStyle = "#5b6470"; g.font = `18px "Inter"`; g.fillText("BOT", wx + 8, y - 2); }
    g.fillStyle = "#16191d"; g.font = `30px "Inter"`; y = wrap(text, 84, y + 44, W - 120, 40);
    if (tag) {  // the bot's little map card
      g.fillStyle = "#e8ecef"; rrect(84, y - 10, W - 120, 150, 12); g.fill();
      g.strokeStyle = "#c8cfd6"; g.lineWidth = 3;
      for (let k = 0; k < 5; k++) { g.beginPath(); g.moveTo(84, y + 20 + k * 28); g.lineTo(W - 36, y + 4 + k * 30); g.stroke(); }
      g.fillStyle = "#4a5562"; for (const [mx, my] of [[150, 40], [260, 90], [340, 50], [420, 110]]) {
        g.beginPath(); g.arc(mx, y + my, 9, 0, 7); g.fill(); }
      y += 160;
    }
    g.fillStyle = "#8a929c"; g.font = `22px "Inter"`; g.fillText("Reply", 84, y + 4); y += 56;
  }
  if (tail) {  // the empty reply box at the thread's end
    g.fillStyle = "#ffffff"; rrect(32, y, W - 64, 90, 14); g.fill();
    g.strokeStyle = "#c3c8cf"; g.lineWidth = 2; rrect(32, y, W - 64, 90, 14); g.stroke();
    g.fillStyle = "#9aa2ac"; g.font = `28px "Inter"`; g.fillText("Add a reply", 60, y + 55);
  }
  g.restore();
  g.fillStyle = "#ffffff"; g.fillRect(0, 0, W, 110);  // the top bar
  g.fillStyle = "#e3e6ea"; g.fillRect(0, 108, W, 2);
  g.fillStyle = "#3a4048"; g.font = `30px "Inter"`; g.textAlign = "left"; g.fillText("‹", 28, 72);
  g.font = `600 28px "Inter"`; g.textAlign = "center"; g.fillText(THREAD.community, W / 2, 70);
  g.textAlign = "left";
}

function photo_review() {  // the photo just taken, in a plain photo viewer
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  const ih = W * PLATE.height / PLATE.width;  // landscape photo, fitted to the width
  g.drawImage(PLATE, 0, (H - ih) / 2, W, ih);
  g.fillStyle = "rgba(255,255,255,0.85)"; g.font = `26px "Inter"`; g.textAlign = "center"; g.fillText("Just now", W / 2, 90);
  g.textAlign = "left";
}

function statusbar(dark, clock) {
  g.fillStyle = dark ? "#ffffff" : "#16191d"; g.font = `600 22px "Inter"`; g.textAlign = "left"; g.fillText(clock || "8:12", 32, 34);
  g.textAlign = "right"; g.fillText("▮▮▮  ▭", W - 28, 34); g.textAlign = "left";
}

// S01d: the photo, a swipe to the reader app, the thread scrolling past the bot's reply and its "good bot"s
function phone_s01d(t) {
  if (t < S.taken) { g.fillStyle = "#050506"; g.fillRect(0, 0, W, H); return; }  // the screen dark until the photo
  const [s0, s1] = S.swipe, [c0, c1] = S.scroll;
  const k = ease(clamp((t - s0) / (s1 - s0)));
  if (k < 1) { g.save(); g.translate(-k * W, 0); photo_review(); statusbar(true); g.restore(); }
  // two flicks with a reading pause after each (a steady 2.5 s scroll left every frame mid-motion, so the render's
  // motion blur greyed the text out: the human, "washed out ... particularly in the SF Breakfast screencast")
  const out = (x) => 1 - Math.pow(1 - x, 3);
  const sc = 0.55 * out(clamp((t - c0) / 0.3)) + 0.45 * out(clamp((t - c0 - 1.25) / 0.3));
  if (k > 0) { g.save(); g.translate((1 - k) * W, 0); reader(sc * S.scroll_px, false); statusbar(false); g.restore(); }
}

// S49: the same thread at its end, an empty reply box, under the app's shut-down notice
function phone_s49(t) {
  reader(S.scroll_px_end, true); statusbar(false, "11:47");
  g.fillStyle = "rgba(10,12,14,0.55)"; g.fillRect(0, 0, W, H);
  const cw = W - 80, ch = 330, cx = 40, cy = (H - ch) / 2;
  g.fillStyle = "#ffffff"; rrect(cx, cy, cw, ch, 22); g.fill();
  g.fillStyle = "#16191d"; g.font = `600 34px "Inter"`; g.textAlign = "center"; g.fillText("This app has shut down", W / 2, cy + 74);
  g.fillStyle = "#4a5260"; g.font = `26px "Inter"`;
  g.fillText("It stopped working on June 30, 2023,", W / 2, cy + 132);
  g.fillText("when free access to the API ended.", W / 2, cy + 168);
  g.fillText("Thanks for reading with us.", W / 2, cy + 220);
  g.fillStyle = "#c3c8cf"; g.fillRect(cx, cy + 258, cw, 2);
  g.fillStyle = "#9aa2ac"; g.font = `600 28px "Inter"`; g.fillText("OK", W / 2, cy + 303);
  g.textAlign = "left";
}

// S50 (M6): the end card on black, its pages (overlays/cards.json) one after another, each fading in and out
function end_card(t) {
  g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
  let t0 = S.from, k = 0;
  while (k < S.seconds.length - 1 && t >= t0 + S.seconds[k]) { t0 += S.seconds[k]; k++; }
  const P = S.pages[k], dur = S.seconds[k];
  const a = clamp(Math.min((t - t0) / 0.5, (t0 + dur - t) / 0.5));
  g.save(); g.globalAlpha = a; g.textAlign = "left"; g.textBaseline = "alphabetic";
  g.scale(W / 1280, H / 720);  // laid out at 1280x720, drawn at the canvas's size (1920x1080 for the final)
  const L = 120, R = 1280 - 120;
  let y = P.facts ? 110 : 170;
  if (P.title) { g.fillStyle = "#ffffff"; g.font = `600 44px "Inter"`; g.fillText(P.title, L, y); y += P.facts ? 66 : 80; }
  if (P.lines) {
    g.font = `26px "Inter"`;
    for (const line of P.lines) { g.fillStyle = "#e6e6e6"; y = wrap(line, L, y, R - L, 36) + 22; }
  }
  if (P.facts) {
    for (const [text, src] of P.facts) {
      g.font = `19px "Inter"`; const sw = Math.max(180, g.measureText(src).width);  // M8: room for a long source
      g.fillStyle = "#e6e6e6"; g.font = `24px "Inter"`;
      const y1 = wrap(text, L, y, R - L - sw - 30, 32);
      g.fillStyle = "#8a8f96"; g.font = `19px "Inter"`; g.textAlign = "right"; g.fillText(src, R, y); g.textAlign = "left";
      y = y1 + 18;
    }
  }
  g.restore();
}

const SHOW = { lobby_blackmail, lobby_traffic, pawn_led, ticker, billboard_reply, login_prompt, phone_s01d, phone_s49, end_card };
function show(name, t) { if (!S || S !== C.screens[name]) { size(name); dotSrc = null; } SHOW[name](t); }
</script>
</body>
</html>
